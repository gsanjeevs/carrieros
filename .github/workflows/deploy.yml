# Migration-only pipeline for staging. Runs automatically after CI passes on
# main. Does NOT deploy carrieros-web -- the app runs on AWS ECS Express Mode
# (see architecture/deployment.md), and deploying it from here would need
# GitHub OIDC trust roles the account owner deliberately chose not to
# hand-wire; the app is built/pushed/deployed manually for now (exact
# commands in architecture/deployment.md). A CodeBuild + GitHub-connection
# auto-deploy path is planned but not built -- see the same doc.
#
# One-time setup (GitHub -> Settings -> Environments) is in architecture/deployment.md.
# The `staging` environment needs one secret: DATABASE_URL (direct Postgres
# connection string for the staging Supabase project).
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate-staging:
    name: Migrate staging database
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: staging
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pending migrations
        run: node scripts/db/migrate.mjs --status
      - name: Apply migrations
        run: node scripts/db/migrate.mjs
