# Deploy pipeline: main -> staging (automatic) -> production (manual approval).
#
# Order matters and is the point of doing this in one workflow rather than a
# host's git integration: the DATABASE is migrated first, then the app that
# needs the new schema is deployed. Migrations are expand/contract-safe by
# policy (architecture/database-migrations.md), so the previous app version keeps
# working against the new schema during the window between the two steps.
#
# One-time setup (GitHub -> Settings -> Environments) is in architecture/deployment.md.
# Each environment needs these secrets:
#   DATABASE_URL       direct Postgres connection string of that environment's Supabase project
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
# Add required reviewers to the `production` environment: that is the approval gate.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  staging:
    name: Staging
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: staging
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pending migrations
        run: node scripts/db/migrate.mjs --status
      - name: Apply migrations
        run: node scripts/db/migrate.mjs
      - name: Deploy web (preview target = staging)
        working-directory: carrieros-web
        run: |
          npx --yes vercel@latest pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
          npx --yes vercel@latest build --token=${{ secrets.VERCEL_TOKEN }}
          npx --yes vercel@latest deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }} | tee /tmp/url.txt
      - name: Smoke test
        run: |
          url=$(tail -n1 /tmp/url.txt)
          for i in $(seq 1 15); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url/login" || true)
            [ "$code" = "200" ] && echo "smoke OK: $url" && exit 0
            sleep 4
          done
          echo "smoke test failed for $url (last status $code)"; exit 1

  production:
    name: Production
    needs: staging
    runs-on: ubuntu-latest
    environment: production   # configure required reviewers on this environment
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pending migrations
        run: node scripts/db/migrate.mjs --status
      - name: Apply migrations
        run: node scripts/db/migrate.mjs
      - name: Deploy web to production
        working-directory: carrieros-web
        run: |
          npx --yes vercel@latest pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          npx --yes vercel@latest build --prod --token=${{ secrets.VERCEL_TOKEN }}
          npx --yes vercel@latest deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} | tee /tmp/url.txt
      - name: Smoke test
        run: |
          url=$(tail -n1 /tmp/url.txt)
          for i in $(seq 1 15); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url/login" || true)
            [ "$code" = "200" ] && echo "smoke OK: $url" && exit 0
            sleep 4
          done
          echo "smoke test failed for $url (last status $code)"; exit 1
